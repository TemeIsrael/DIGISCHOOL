services:
  - type: web
    name: digischool-api
    runtime: node
    plan: free
    region: oregon
    rootDir: ecole-app
    buildCommand: pnpm install && pnpm build --filter @ecole-app/shared && pnpm build --filter @ecole-app/api
    startCommand: cd apps/api && pnpm start
    envVars:
      - key: PNPM_VERSION
        value: 9.1.0
      - key: DB_HOST
        value: mysql-digischool-temeisrael65-91e3.b.aivencloud.com
      - key: DB_PORT
        value: 24262
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        value: israel235
      - key: DB_NAME
        value: defaultdb
      - key: DB_SSL
        value: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
